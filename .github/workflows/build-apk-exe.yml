name: Build Android APK & Web Preview

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-android-apk:
    name: Build Android APK (UniCampus.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies & Capacitor
        run: |
          npm ci
          npm install @capacitor/core @capacitor/cli @capacitor/android --no-save

      - name: Build Web Bundle
        run: npm run build

      - name: Sync Capacitor Android Project
        run: |
          if [ ! -f "android/gradlew" ]; then
            rm -rf android
            npx cap add android
          else
            npx cap sync android
          fi

      - name: Build Signed Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK to UniCampus.apk
        run: cp android/app/build/outputs/apk/debug/app-debug.apk UniCampus.apk

      - name: Upload UniCampus.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniCampus-Android-APK
          path: UniCampus.apk

  deploy-web-preview:
    name: Deploy Web Preview (GitHub Pages)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies & Build Web Preview
        run: |
          npm ci
          npm run build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
